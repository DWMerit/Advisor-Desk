# orbit/ontology/nodes/context/external_ref.yaml
#
# Mirrors the shape of config/ontology/nodes/source_code/*.yaml from
# gitlabhq/orbit-knowledge-graph @ 0fe19ac: a node type, its properties, and the
# storage columns the table is built from.
#
# A pointer that does not land on an indexed row still has to land somewhere, or
# the graph reports a surface as pointing at nothing when it points at something
# this detector set cannot see. ExternalRef is that somewhere: the address as the
# estate wrote it, and which of three non-resolutions it met.
#
# The three sub_kind values are never merged. Each is a statement about the
# detector set, not about the file -- "the address left the indexed root", "the
# address named a scheme", and "the address stayed inside the root and nothing
# there matched" are three different findings, and collapsing them into one
# count would say something none of them says.

node_type: ExternalRef
domain: context
description: A pointer target that did not resolve to a row inside the indexed root
label: address
default_columns: [id, address, sub_kind]
destination_table: gl_context_external_ref
sort_key: [traversal_path, project_id, branch, address]

style:
  size: 12
  color: "#94A3B8"

redaction:
  resource_type: project
  id_column: project_id
  ability: read_code

properties:
  id:
    type: int64
    source: id
    nullable: false
    mutable: false
    description: "Unique ID."
    traversal_path_lookup:
      kind: id
      source_table: gl_context_external_ref
      key_column: id

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    nullable: false
    description: "Namespace path for authz."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID."

  branch:
    type: string
    source: branch
    nullable: false
    mutable: false
    description: "Git branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    mutable: false
    description: "Indexed commit SHA."

  address:
    type: string
    source: address
    nullable: false
    mutable: false
    description: "The pointer target exactly as the estate wrote it, before any expansion or normalisation. The estate's own words, so the constrained vocabulary does not apply to it."

  sub_kind:
    type: string
    source: sub_kind
    nullable: false
    mutable: false
    description: "outside-indexed-roots | no-indexed-target-match | unresolvable-scheme. outside-indexed-roots: the address resolved to a location above the repository root, including a sibling repository in the same estate, which is a different snapshot rather than a target here. unresolvable-scheme: the address named a URI scheme, so nothing on this filesystem is being pointed at. no-indexed-target-match: the address stayed inside the repository root and no file was there. Never merged."
    selectivity: low

storage:
  settings:
    index_granularity: "1024"
    auto_statistics_types: "'minmax, uniq, countmin'"
  columns:
    - {name: id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: branch, type: "String", codec: ["ZSTD(1)"]}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: address, type: "String", codec: ["ZSTD(3)"]}
    - {name: sub_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
  indexes:
    - {name: idx_id, column: id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_project_id, column: project_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_address, column: address, type: "text(tokenizer = splitByString(['/']))", granularity: 1}
