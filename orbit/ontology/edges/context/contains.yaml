# orbit/ontology/edges/context/contains.yaml
#
# One edge type, many from/to pairs, in GitLab's edge format: the variants are
# declared on the type rather than the type being declared once per pair.
#
# CONTAINS already exists in their ontology and is reused as-is. Here it carries
# Markdown nesting: a surface contains its top-level clauses, and a clause
# contains the clauses nested inside it. Depth is a walk of these edges, not a
# column -- adding a depth column would freeze at index time something the graph
# can answer at query time.

edge_type: CONTAINS
domain: context
description: Structural containment -- a surface holds a clause, a clause holds a clause nested inside it
destination_table: gl_context_edge

variants:
  - from_node: Surface
    to_node: Clause
    description: A surface contains a clause that no other clause encloses.
  - from_node: Clause
    to_node: Clause
    description: A clause contains a clause nested inside it -- a subheading, a list item beneath a heading, a nested list item, a fenced block.

properties:
  source_id:
    type: int64
    source: source_id
    nullable: false
    mutable: false
    description: "id of the row the edge leaves."

  source_kind:
    type: string
    source: source_kind
    nullable: false
    mutable: false
    description: "Node type of the source row -- the variant's from_node."
    selectivity: low

  relationship_kind:
    type: string
    source: relationship_kind
    nullable: false
    mutable: false
    description: "The edge type. CONTAINS here."
    selectivity: low

  target_id:
    type: int64
    source: target_id
    nullable: false
    mutable: false
    description: "id of the row the edge enters."

  target_kind:
    type: string
    source: target_kind
    nullable: false
    mutable: false
    description: "Node type of the target row -- the variant's to_node."
    selectivity: low

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    nullable: false
    description: "Namespace path for authz."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID. Carried on the edge for the same reason the nodes carry it: every local row shares the empty traversal_path, so this is what tells two repositories apart, and it is half the key a re-index replaces rows by."

  branch:
    type: string
    source: branch
    nullable: false
    mutable: false
    description: "Git branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    mutable: false
    description: "Indexed commit SHA."

storage:
  settings:
    index_granularity: "1024"
    auto_statistics_types: "'minmax, uniq, countmin'"
  columns:
    - {name: source_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: source_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: relationship_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: target_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: target_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: branch, type: "String", codec: ["ZSTD(1)"]}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
  indexes:
    - {name: idx_source_id, column: source_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_target_id, column: target_id, type: "bloom_filter(0.0001)", granularity: 1}
