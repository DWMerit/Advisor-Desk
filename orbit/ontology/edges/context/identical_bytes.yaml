# orbit/ontology/edges/context/identical_bytes.yaml
#
# One edge type, in GitLab's edge format, routed to the same gl_context_edge
# table as CONTAINS, REFERENCES and PRODUCES.
#
# Pure observation: two files hash to the same sha256. Nothing here says why,
# and nothing here says whether that is intended -- spec 0001 §14 lists
# "whether two identical files are intentionally identical" as a permanent
# UNKNOWN. The word for the finding is the measurement that produced it.
#
# File is Orbit's own gl_file, in their database, not a row this indexer
# writes. The id is a deterministic handle over the snapshot and the path, and
# the join that crosses graphs goes by source_path and target_path.
#
# Byte-identity on its own over-reads. A count of matching pairs is never
# emitted without the count of those pairs carrying provenance evidence, which
# is what the PRODUCES edges beside these rows hold.
#
# **The direction is the same argument one level in.** The pair is symmetric, so
# which end came first is a second thing the row does not say -- and on the
# estate this was built for, all 28 pairs are a workbench file matching a
# published file with the order plain to a human and invisible to the tool. So
# every row carries `direction`: the order where a PRODUCES edge relates the
# pair's own two ends, and UNKNOWN with `direction_reason` where nothing does.
#
# A producer elsewhere in the tree does not order a pair, and neither does a
# sentence. Spec 0001 s14 keeps prose provenance a permanent UNKNOWN, and a
# direction read out of a sentence would be indistinguishable in this table from
# one something observed -- which is what makes it worse than no direction.

edge_type: IDENTICAL_BYTES
domain: context
description: Two files in one repository hash to the same sha256 -- an observation about the bytes, and nothing more
destination_table: gl_context_edge

variants:
  - from_node: File
    to_node: File
    description: Two files whose contents hash the same. The relation is symmetric, so one row is written per unordered pair, with the lexicographically first path as the source -- two rows would be one fact counted twice.

properties:
  source_id:
    type: int64
    source: source_id
    nullable: false
    mutable: false
    description: "id of the row the edge leaves -- a deterministic handle over the snapshot and the path, because the file's own row lives in Orbit's gl_file."

  source_kind:
    type: string
    source: source_kind
    nullable: false
    mutable: false
    description: "Node type of the source row. File here."
    selectivity: low

  relationship_kind:
    type: string
    source: relationship_kind
    nullable: false
    mutable: false
    description: "The edge type. IDENTICAL_BYTES here."
    selectivity: low

  target_id:
    type: int64
    source: target_id
    nullable: false
    mutable: false
    description: "id of the row the edge enters, on the same handle convention as source_id."

  target_kind:
    type: string
    source: target_kind
    nullable: false
    mutable: false
    description: "Node type of the row the edge enters. File here."
    selectivity: low

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    nullable: false
    description: "Namespace path for authz."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID. A pair is only ever written within one repository: two repositories are two snapshots, with their own branch and commit, and an edge across them would join two things this indexer has not established are the same."

  branch:
    type: string
    source: branch
    nullable: false
    mutable: false
    description: "Git branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    mutable: false
    description: "Indexed commit SHA."

  source_path:
    type: string
    source: source_path
    nullable: true
    mutable: false
    description: "Repository-relative path of the first file of the pair, lexicographically. NULL on edge types that carry no path."

  target_path:
    type: string
    source: target_path
    nullable: true
    mutable: false
    description: "Repository-relative path of the second file of the pair. NULL on edge types that carry no path."

  content_sha256:
    type: string
    source: content_sha256
    nullable: true
    mutable: false
    description: "The sha256 both files hash to, in hex. It is the whole evidence for this edge, so it is carried on the row rather than recomputed. NULL on edge types that are not derived from a hash."

  direction:
    type: string
    source: direction
    nullable: true
    mutable: false
    description: "Which end of the pair the evidence puts first, stated against this row's own columns: source-produces-target | target-produces-source | UNKNOWN. The row is written with the lexicographically first path as the source, so the direction is said against that ordering rather than by reordering the row. UNKNOWN rather than NULL where nothing ordered the pair: a NULL reads as a column nobody filled in, and this is a measurement. NULL on edge types that carry no direction."
    selectivity: low

  direction_reason:
    type: string
    source: direction_reason
    nullable: true
    mutable: false
    description: "Why a pair carries no direction: no-producer-named-at-either-end | producer-named-outside-the-pair | each-end-names-the-other-as-its-producer. Three statements, never merged -- a pair whose ends are both artifacts of one script has provenance and still nothing that orders them, and counting it with the pairs no evidence reaches would be untrue about both. NULL where a direction was found, and on edge types that carry no direction."
    selectivity: low

  subtype:
    type: string
    source: subtype
    nullable: true
    mutable: false
    description: "Which rung of the evidence ladder carried the direction: artifact-header | manifest-declaration | literal-write-path. The same vocabulary PRODUCES uses, because it is the same evidence read from the same place. NULL where the pair carries no direction, and on edge types that carry no detector."
    selectivity: low

  evidence_path:
    type: string
    source: evidence_path
    nullable: true
    mutable: false
    description: "Repository-relative path of the file the direction was read from -- usually neither end of the pair, because a manifest declaring one end produces the other is a third file. NULL where the pair carries no direction, and on edge types that carry no evidence locator."

  evidence_line:
    type: int64
    source: evidence_line
    nullable: true
    mutable: false
    description: "1-based line the direction was read from. With evidence_path it is the file:line locator, so a direction this table asserts can be read back out of the estate rather than taken on the tool's word. NULL where the pair carries no direction."

storage:
  settings:
    index_granularity: "1024"
    auto_statistics_types: "'minmax, uniq, countmin'"
  columns:
    - {name: source_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: source_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: relationship_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: target_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: target_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: branch, type: "String", codec: ["ZSTD(1)"]}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: source_path, type: "String", codec: ["ZSTD(3)"]}
    - {name: target_path, type: "String", codec: ["ZSTD(3)"]}
    - {name: content_sha256, type: "String", codec: ["ZSTD(1)"]}
    - {name: direction, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: direction_reason, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: subtype, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: evidence_path, type: "String", codec: ["ZSTD(3)"]}
    - {name: evidence_line, type: "Int64", codec: ["T64", "ZSTD(1)"]}
  indexes:
    - {name: idx_content_sha256, column: content_sha256, type: "bloom_filter(0.0001)", granularity: 1}
