# orbit/ontology/edges/context/produces.yaml
#
# One edge type, in GitLab's edge format, routed to the same gl_context_edge
# table as CONTAINS, REFERENCES and IDENTICAL_BYTES.
#
# A generator and the artifact it writes, on an evidence ladder, strongest
# first:
#
#   1. artifact-header      the artifact's own header names its producer
#   2. manifest-declaration a config or manifest declares input -> output
#   3. literal-write-path   a script contains a literal path it writes to
#
# The rung is the edge's subtype, so a reader can see which rung a row stands
# on rather than being told only that a producer exists. One artifact keeps the
# strongest rung found for it; a weaker rung is not written beside a stronger
# one for the same pair, or the same fact would be counted twice at two
# strengths.
#
# What this edge does NOT say: that the artifact is current with respect to its
# producer. Spec 0001 §14 lists that as a permanent UNKNOWN, and nothing here
# derives it.
#
# Both ends are Orbit's own gl_file, in their database. The ids are
# deterministic handles over the snapshot and the path, and the join that
# crosses graphs goes by source_path and target_path.

edge_type: PRODUCES
domain: context
description: A generator and the artifact it writes, on the strongest rung of evidence found for that artifact
destination_table: gl_context_edge

variants:
  - from_node: File
    to_node: File
    description: The producer names a file in this repository, and so does the artifact. A producer that resolves to nothing in the tree writes no edge -- it is counted in the statistics instead, because an edge needs both ends.

properties:
  source_id:
    type: int64
    source: source_id
    nullable: false
    mutable: false
    description: "id of the row the edge leaves -- the producer. A deterministic handle over the snapshot and the path, because the file's own row lives in Orbit's gl_file."

  source_kind:
    type: string
    source: source_kind
    nullable: false
    mutable: false
    description: "Node type of the source row. File here."
    selectivity: low

  relationship_kind:
    type: string
    source: relationship_kind
    nullable: false
    mutable: false
    description: "The edge type. PRODUCES here."
    selectivity: low

  target_id:
    type: int64
    source: target_id
    nullable: false
    mutable: false
    description: "id of the row the edge enters -- the artifact, on the same handle convention as source_id."

  target_kind:
    type: string
    source: target_kind
    nullable: false
    mutable: false
    description: "Node type of the row the edge enters. File here."
    selectivity: low

  traversal_path:
    type: string
    source: traversal_path
    filterable: false
    nullable: false
    description: "Namespace path for authz."

  project_id:
    type: int64
    source: project_id
    nullable: false
    mutable: false
    description: "Owning project ID. Both ends are in one repository: a producer in a sibling repository is a different snapshot, with its own branch and commit."

  branch:
    type: string
    source: branch
    nullable: false
    mutable: false
    description: "Git branch."

  commit_sha:
    type: string
    source: commit_sha
    nullable: false
    mutable: false
    description: "Indexed commit SHA."

  subtype:
    type: string
    source: subtype
    nullable: true
    mutable: false
    description: "Which rung of the ladder the row stands on: artifact-header | manifest-declaration | literal-write-path. Strongest first, and one artifact keeps only its strongest rung. NULL on edge types that carry no detector, CONTAINS among them."
    selectivity: low

  source_path:
    type: string
    source: source_path
    nullable: true
    mutable: false
    description: "Repository-relative path the producer resolved to. NULL on edge types that carry no path."

  source_address:
    type: string
    source: source_address
    nullable: true
    mutable: false
    description: "The producer exactly as the estate wrote it, before trimming or resolution -- kept beside source_path so what was written and where it landed can be read apart. A header comment carries trailing syntax (`Generated by scripts/build.py -- DO NOT EDIT -->`), so only the first token is parsed as the name, and this column is what makes that parse checkable against the estate's own words. NULL on edge types whose address names the target rather than the source."

  target_path:
    type: string
    source: target_path
    nullable: true
    mutable: false
    description: "Repository-relative path of the artifact. NULL on edge types that carry no path."

  evidence_path:
    type: string
    source: evidence_path
    nullable: true
    mutable: false
    description: "Repository-relative path of the file the evidence was read from. It is not always either end of the edge: an artifact header sits in the artifact, a manifest declaration in a third file, a literal write path in the producer. NULL on edge types that carry no evidence locator."

  evidence_line:
    type: int64
    source: evidence_line
    nullable: true
    mutable: false
    description: "1-based line the evidence was written on. With evidence_path it is the file:line locator every PRODUCES row carries, so the claim can be read back out of the estate. NULL on edge types that carry no evidence locator."

storage:
  settings:
    index_granularity: "1024"
    auto_statistics_types: "'minmax, uniq, countmin'"
  columns:
    - {name: source_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: source_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: relationship_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: target_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: target_kind, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: traversal_path, type: "String", codec: ["ZSTD(1)"]}
    - {name: project_id, type: "Int64", codec: ["T64", "ZSTD(1)"]}
    - {name: branch, type: "String", codec: ["ZSTD(1)"]}
    - {name: commit_sha, type: "String", default: "''", codec: ["ZSTD(1)"]}
    - {name: subtype, type: "LowCardinality(String)", codec: ["LZ4"]}
    - {name: source_path, type: "String", codec: ["ZSTD(3)"]}
    - {name: source_address, type: "String", codec: ["ZSTD(3)"]}
    - {name: target_path, type: "String", codec: ["ZSTD(3)"]}
    - {name: evidence_path, type: "String", codec: ["ZSTD(3)"]}
    - {name: evidence_line, type: "Int64", codec: ["T64", "ZSTD(1)"]}
  indexes:
    - {name: idx_produces_source_id, column: source_id, type: "bloom_filter(0.0001)", granularity: 1}
    - {name: idx_produces_target_id, column: target_id, type: "bloom_filter(0.0001)", granularity: 1}
